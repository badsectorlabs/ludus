- name: Set router lookup name
  ansible.builtin.set_fact:
    router_lookup_name: "{{ router.vm_name | default(default_router_vm_name) }}"
  when: router_vm_id is not defined or router_node_name is not defined

- name: Get router VM info via Proxmox API
  ansible.builtin.uri:
    url: "{{ proxmox_url }}/api2/json/cluster/resources?type=vm"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}"
    validate_certs: false
  register: router_id_command
  changed_when: false
  no_log: true
  when: router_vm_id is not defined or router_node_name is not defined

- name: Set router VM info from API lookup
  ansible.builtin.set_fact:
    router_vm_info: "{{ (router_id_command.json.data | selectattr('name', 'equalto', router_lookup_name) | list | first) | default({}) }}"
  when: router_vm_id is not defined or router_node_name is not defined

- name: Set the router_vm_id from API lookup
  ansible.builtin.set_fact:
    router_vm_id: "{{ router_vm_info.vmid | default('') }}"
  when: router_vm_id is not defined

- name: Set the router_node_name from API lookup
  ansible.builtin.set_fact:
    router_node_name: "{{ router_vm_info.node | default(node_name) }}"
  when: router_node_name is not defined

- name: Fail if router is missing on source node
  ansible.builtin.fail:
    msg: "Router VM {{ router_lookup_name }} does not exist in the Proxmox cluster"
  when: router_vm_id | string | length == 0

- name: Get MAC for vlan interface
  ansible.builtin.shell: |
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/config" | jq -r '.[] | to_entries[] | select(.key|startswith("net")).value | select(contains("tag={{ item }}"))' | cut -d '=' -f 2 | cut -d ',' -f 1
  register: vlan_mac_command

- name: Show vlan_mac_command
  ansible.builtin.debug:
    msg: "{{ vlan_mac_command.stdout }}"

- name: Set the vlan_mac variable
  ansible.builtin.set_fact:
    vlan_mac: "{{ vlan_mac_command.stdout }}"
  when: vlan_mac_command.stdout | length != 0

- name: Show VLAN MAC
  ansible.builtin.debug:
    msg: "{{ vlan_mac }}"
  when: vlan_mac_command.stdout | length != 0

- name: Get interface for MAC of vlan interface
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/agent/network-get-interfaces" | jq -er --arg mac "{{ vlan_mac | lower }}" '.data.result[]? | select(."hardware-address"==$mac).name'
  args:
    executable: /bin/bash
  register: interface_name_command
  when: vlan_mac_command.stdout | length != 0
  retries: 20
  delay: 3
  until:
    - interface_name_command.rc == 0
    - interface_name_command.stdout | length > 0

- name: Set the interface_name_command variable
  ansible.builtin.set_fact:
    interface_name: "{{ interface_name_command.stdout }}"
  when: vlan_mac_command.stdout | length != 0

- name: Get the number for the next network interface (starts at 0)
  ansible.builtin.shell: |
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/config" | jq '.[] | . | keys[] | select(startswith("net"))' | wc -l
  register: next_interface_command
  when: interface_name is undefined or vlan_mac_command.stdout | length == 0

- name: Set the rotuer_net_interface variable
  ansible.builtin.set_fact:
    router_net_interface: "{{ next_interface_command.stdout }}"
  when: interface_name is undefined or vlan_mac_command.stdout | length == 0

- name: Show the range_bridge_name variable
  ansible.builtin.debug:
    msg: "Router bridge name for vlan {{ item }}: {{ range_bridge_name }}"
  when: interface_name is undefined or vlan_mac_command.stdout | length == 0

- name: Add network interface to router
  community.general.proxmox_nic:
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    api_host: "{{ api_host }}"
    vmid: "{{ router_vm_id }}"
    interface: "net{{ router_net_interface }}"
    bridge: "{{ range_bridge_name }}"
    tag: "{{ item }}"
  when: interface_name is undefined or vlan_mac_command.stdout | length == 0
  register: network_add

# Now that the interface has been added, get the interface name on the router
- name: Get MAC for vlan interface
  ansible.builtin.shell: |
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/config" | jq -r '.[] | to_entries[] | select(.key|startswith("net")).value | select(contains("tag={{ item }}"))' | cut -d '=' -f 2 | cut -d ',' -f 1
  register: vlan_mac_command
  when: network_add is changed

- name: Set the vlan_mac variable
  ansible.builtin.set_fact:
    vlan_mac: "{{ vlan_mac_command.stdout }}"
  when: network_add is changed

- name: Get interface for MAC of vlan interface
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/agent/network-get-interfaces" | jq -er --arg mac "{{ vlan_mac | lower }}" '.data.result[]? | select(."hardware-address"==$mac).name'
  args:
    executable: /bin/bash
  register: interface_name_command
  when: network_add is changed
  retries: 20
  delay: 3
  until:
    - interface_name_command.rc == 0
    - interface_name_command.stdout | length > 0

- name: Set the interface_name_command variable
  ansible.builtin.set_fact:
    interface_name: "{{ interface_name_command.stdout }}"
  when: network_add is changed

# 192.0.2.x is set by the proxmox build
- name: Get the interface with a 192.0.2.x ip (WAN)
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -k -H "Authorization: PVEAPIToken={{ proxmox_token_id }}={{ proxmox_token_secret }}" "{{ proxmox_url }}/api2/json/nodes/{{ router_node_name | default(node_name) }}/qemu/{{ router_vm_id }}/agent/network-get-interfaces" | jq -er '.data.result[]? | select(."ip-addresses"[]?."ip-address"|test("192.0.2")).name'
  args:
    executable: /bin/bash
  register: wan_interface_command
  when: network_add is changed
  retries: 20
  delay: 3
  until:
    - wan_interface_command.rc == 0
    - wan_interface_command.stdout | length > 0

- name: Set the router_external_interface variable
  ansible.builtin.set_fact:
    router_external_interface: "{{ wan_interface_command.stdout }}"
  when: network_add is changed

- name: Set up the IP configuration for the new interface
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR {{ hostvars['localhost']['interface_name'] }}"
    block: |
      auto {{ hostvars['localhost']['interface_name'] }}
      iface {{ hostvars['localhost']['interface_name'] }} inet static
          address 10.{{ range_second_octet }}.{{ item }}.254/24
          post-up   iptables -t nat -A POSTROUTING -s '10.{{ range_second_octet }}.{{ item }}.0/24' ! -d {{ wg_server_allowed_ips }} -o {{ router_external_interface }} -j MASQUERADE
          post-down iptables -t nat -D POSTROUTING -s '10.{{ range_second_octet }}.{{ item }}.0/24' ! -d {{ wg_server_allowed_ips }} -o {{ router_external_interface }} -j MASQUERADE
  delegate_to: "{{ router.vm_name | default(default_router_vm_name) }}"
  become: true
  register: interfaces_status
  when: network_add is changed

- name: Enable new interface
  ansible.builtin.shell: ifup {{ hostvars['localhost']['interface_name'] }}
  delegate_to: "{{ router.vm_name | default(default_router_vm_name) }}"
  become: true
  when: interfaces_status is changed

- name: Configure dnsmasq (part 1) - setup base config
  ansible.builtin.template:
    src: router-dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/dnsmasq-{{ hostvars['localhost']['interface_name'] }}.conf
  delegate_to: "{{ router.vm_name | default(default_router_vm_name) }}"
  become: true
  when: interfaces_status is changed

- name: Configure dnsmasq (part 2) - enable and restart service
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: restarted
  delegate_to: "{{ router.vm_name | default(default_router_vm_name) }}"
  become: true
  when: interfaces_status is changed
