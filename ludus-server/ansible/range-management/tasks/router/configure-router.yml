- name: Setup ip forwarding on the router
  become: true
  sysctl:
    name: net.ipv4.ip_forward
    value: 1
    sysctl_set: true
    state: present
    reload: true

- name: Disable ipv6
  become: true
  sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: 1
    sysctl_set: true
    state: present
    reload: true

- name: Install dnsmasq, ca-certificates, and iptables-persistent
  ansible.builtin.apt:
    name:
      - dnsmasq
      - iptables-persistent
      - ca-certificates
      - rsync
      - curl
      - conntrack
    state: present

- name: Disable DNS in dnsmasq (only use it for DHCP)
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    line: 'port=0'
    create: true

- name: Restart dnsmasq service to pick up changes
  ansible.builtin.service:
    name: dnsmasq
    state: restarted

- name: Use NAT DNS while installing AdGuardHome
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ ludus_nat_ip }}

- name: Check for a preinstalled AdGuardHome binary
  ansible.builtin.stat:
    path: /opt/AdGuardHome/AdGuardHome
  register: adguard_home_binary

- name: Install AdGuardHome
  ansible.builtin.shell: |
    set -o pipefail
    curl -s -S -L https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh | sh -s -- -v
  args:
    executable: /bin/bash
  register: adguard_install
  failed_when: adguard_install.rc != 0 and 'the existing AdGuard Home installation is detected' not in adguard_install.stderr
  when: not adguard_home_binary.stat.exists

- name: Check AdGuardHome install directory
  ansible.builtin.stat:
    path: /opt/AdGuardHome
  register: adguard_home_dir

- name: Fail if AdGuardHome did not install
  ansible.builtin.fail:
    msg: "AdGuardHome install did not create /opt/AdGuardHome"
  when: not adguard_home_dir.stat.isdir

- name: Configure AdGuardHome
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/AdGuardHome/AdGuardHome.yaml

- name: Restart AdGuardHome to take config
  ansible.builtin.service:
    name: AdGuardHome
    state: restarted

- name: Drop a file to signal that we have completed configuration
  ansible.builtin.file:
    path: /etc/.ludus-configured
    state: touch
