- name: Ensure Blocky is installed
  ansible.builtin.include_tasks: tasks/router/ensure-blocky.yml

- name: Load Blocky DNS state
  ansible.builtin.include_tasks: tasks/router/load-blocky-state.yml

# ==========================================================
# Block
# ==========================================================
- name: Enable testing-mode DNS blocking
  ansible.builtin.set_fact:
    blocky_state: "{{ blocky_state | combine({'testing': {'enabled': true, 'exempt_clients': action_ips | default([]), 'allowed_domains': (blocky_state.testing.allowed_domains | default({}))}}, recursive=True) }}"
  when: testing_action == "block"

- name: Save Blocky DNS state for testing-mode block
  ansible.builtin.include_tasks: tasks/router/save-blocky-state.yml
  when: testing_action == "block"

# ==========================================================
# Allow
# ==========================================================
- name: Disable testing-mode DNS blocking
  ansible.builtin.set_fact:
    blocky_state: "{{ blocky_state | combine({'testing': {'enabled': false, 'exempt_clients': [], 'allowed_domains': {}}}, recursive=True) }}"
  when: testing_action == "allow"

- name: Save Blocky DNS state for testing-mode allow
  ansible.builtin.include_tasks: tasks/router/save-blocky-state.yml
  when: testing_action == "allow"

# ==========================================================
# Allow Domain
# ==========================================================
- name: Set allowed testing domain facts
  ansible.builtin.set_fact:
    blocky_allowed_domain: "{{ domain | lower }}"
    blocky_allowed_domain_ip: "{{ domainIP }}"
    blocky_testing_allowed_domains: "{{ blocky_state.testing.allowed_domains | default({}) }}"
  when: testing_action == "allow-domain"

- name: Allow testing DNS for domain
  ansible.builtin.set_fact:
    blocky_state: "{{ blocky_state | combine({'testing': {'enabled': true, 'exempt_clients': action_ips | default([]), 'allowed_domains': (blocky_testing_allowed_domains | combine({blocky_allowed_domain: blocky_allowed_domain_ip}))}}, recursive=True) }}"
  when: testing_action == "allow-domain"

- name: Save Blocky DNS state for allowed domain
  ansible.builtin.include_tasks: tasks/router/save-blocky-state.yml
  when: testing_action == "allow-domain"

# ==========================================================
# Domain Block
# ==========================================================
- name: Remove denied testing domain from allowed domain map
  ansible.builtin.set_fact:
    blocky_testing_allowed_domains: "{{ (blocky_state.testing.allowed_domains | default({}) | dict2items | rejectattr('key', 'equalto', domain | lower) | list) | items2dict }}"
  when: testing_action == "deny-domain"

- name: Deny testing DNS for domain
  ansible.builtin.set_fact:
    blocky_state: "{{ blocky_state | combine({'testing': {'enabled': true, 'exempt_clients': action_ips | default([]), 'allowed_domains': blocky_testing_allowed_domains}}, recursive=True) }}"
  when: testing_action == "deny-domain"

- name: Save Blocky DNS state for denied domain
  ansible.builtin.include_tasks: tasks/router/save-blocky-state.yml
  when: testing_action == "deny-domain"
