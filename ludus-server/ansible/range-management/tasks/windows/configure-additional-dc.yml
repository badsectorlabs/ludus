- name: Install Powershell AD Tools
  ansible.windows.win_feature:
    name:
      - RSAT-AD-PowerShell
      - RSAT-AD-AdminCenter
    state: present

- name: Install Active Directory
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    include_sub_features: true
    state: present

- name: Disable password policy
  community.windows.win_security_policy:
    section: System Access
    key: PasswordComplexity
    value: 0

- name: Set DNS
  ansible.windows.win_dns_client:
    adapter_names: '*'
    dns_servers:
      - "{{ dc_ip }}"

- name: Prepare the SSH provisioning account in the destination domain
  ansible.builtin.include_tasks:
    file: tasks/bootstrap/prepare-domain-windows-ssh-key.yml
    apply:
      delegate_to: "{{ dc_vm_name }}"
  vars:
    ludus_windows_domain_ssh_user: "{{ defaults.cert_auth_windows_user | default(ludus_template_user, true) }}"
    ludus_windows_domain_ssh_allow_create: "{{ defaults.cert_auth_create_accounts | default(false) }}"
  when: defaults.use_cert_auth | default(false)

- name: Promoted the server to a DC
  block:
    - name: Promote this server to Additional DC 1
      microsoft.ad.domain_controller:
        dns_domain_name: "{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_user: "{{ domain_admin }}@{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_password: "{{ domain_admin_password }}"
        safe_mode_password: "{{ domain_safe_mode_password }}"
        state: domain_controller
      register: ludus_additional_dc_first
  # Why do you have to run this twice to actually have it take effect? No idea.
    - name: Promote this server to Additional DC 2
      microsoft.ad.domain_controller:
        dns_domain_name: "{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_user: "{{ domain_admin }}@{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_password: "{{ domain_admin_password }}"
        safe_mode_password: "{{ domain_safe_mode_password }}"
        state: domain_controller
      register: ludus_additional_dc_second
  rescue:
    # {"changed": true, "msg": "Failed to install ADDSDomainController with DCPromo: The operation failed because:\r\n\r\n
    # DFS Replication: The dependency service or group failed to start. \r\n\r\n\
    # "The dependency service or group failed to start.\"\r\n", "reboot_required": true}
    - name: Reboot the Additional DC
      ansible.windows.win_reboot:
    - name: Wait for the provisioning connection to become available
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port | default(5986) }}"
        delay: 10
        state: started
      delegate_to: localhost
      become: false
    - name: Disable password policy
      community.windows.win_security_policy:
        section: System Access
        key: PasswordComplexity
        value: 0
      register: password_policy_result
      failed_when: password_policy_result.msg is defined and 'Illegal operation attempted on a registry key that has been marked for deletion.' not in password_policy_result.msg
    - name: Promote this server to Additional DC
      microsoft.ad.domain_controller:
        dns_domain_name: "{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_user: "{{ domain_admin }}@{{ netbios_name }}.{{ fqdn_tail }}"
        domain_admin_password: "{{ domain_admin_password }}"
        safe_mode_password: "{{ domain_safe_mode_password }}"
        state: domain_controller
      register: ludus_additional_dc_retry

- name: Reboot after additional domain-controller promotion
  ansible.windows.win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 60
  when:
    - defaults.use_cert_auth | default(false)
    - >-
      (ludus_additional_dc_first.reboot_required | default(false)) or
      (ludus_additional_dc_second.reboot_required | default(false)) or
      (ludus_additional_dc_retry.reboot_required | default(false))

- name: Refresh and verify SSH identity after additional domain-controller promotion
  ansible.builtin.include_tasks: tasks/bootstrap/refresh-windows-ssh-key.yml
  when: defaults.use_cert_auth | default(false)
