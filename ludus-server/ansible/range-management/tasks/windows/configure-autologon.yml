- name: Remove template-account autologon in certificate-auth ranges
  when:
    - defaults.use_cert_auth | default(false)
    - not (netbios_name is defined and fqdn_tail is defined)
    - autologon_user | lower in [ludus_template_user | default('localuser') | lower, defaults.cert_auth_windows_user | default(ludus_template_user | default('localuser'), true) | lower] or autologon_password == ludus_template_password | default('password')
  block:
    - name: Disable automatic template login
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: AutoAdminLogon
        data: '0'
        type: string

    - name: Remove saved template autologon credentials
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: "{{ item }}"
        state: absent
      loop:
        - DefaultPassword
        - DefaultUserName
        - DefaultDomainName
        - AutoLogonCount
      no_log: true

- name: Configure ordinary or explicitly separate autologon credentials
  when: not defaults.use_cert_auth | default(false) or (netbios_name is defined and fqdn_tail is defined) or (autologon_user | lower not in [ludus_template_user | default('localuser') | lower, defaults.cert_auth_windows_user | default(ludus_template_user | default('localuser'), true) | lower] and autologon_password != ludus_template_password | default('password'))
  block:
    - name: Enable automatic login
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: AutoAdminLogon
        data: 1
        type: string

    - name: Set automatic login username
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: DefaultUserName
        data: "{{ autologon_user }}"
        type: string

    - name: Set automatic login password
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: DefaultPassword
        data: "{{ autologon_password }}"
        type: string
      no_log: true

    - name: Set automatic login domain
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon
        name: DefaultDomainName
        data: "{{ netbios_name }}.{{ fqdn_tail }}"
        type: string
      when: netbios_name is defined and fqdn_tail is defined
