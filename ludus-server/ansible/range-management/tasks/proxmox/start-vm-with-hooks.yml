---
- name: Reset VM lifecycle hook result
  ansible.builtin.set_fact:
    ludus_vm_start_hook_handled: false

- name: Check for the Ludus VM lifecycle hook service
  ansible.builtin.stat:
    path: /run/ludus/vm-hooks.sock
  delegate_to: localhost
  register: ludus_vm_hook_socket
  changed_when: false

- name: Offer VM start to Ludus lifecycle hooks
  ansible.builtin.uri:
    url: http://localhost/v1/start
    unix_socket: /run/ludus/vm-hooks.sock
    method: POST
    body_format: json
    body:
      rangeId: "{{ vm_pool | default(range_id) }}"
      vmId: "{{ vm_id }}"
      vmName: "{{ vm_name }}"
      firstBoot: "{{ (clone_vm is changed) | bool }}"
    return_content: true
    status_code: 200
    timeout: 1500
  delegate_to: localhost
  register: ludus_vm_start_hook
  changed_when: ludus_vm_start_hook.json.handled | default(false) | bool
  when: ludus_vm_hook_socket.stat.issock | default(false)

- name: Record whether a lifecycle hook handled VM start
  ansible.builtin.set_fact:
    ludus_vm_start_hook_handled: "{{ ludus_vm_start_hook.json.handled | default(false) | bool }}"

- name: Start the VM through Proxmox
  community.general.proxmox_kvm:
    api_user: "{{ api_user }}"
    api_token_id: "{{ proxmox_token_id }}"
    api_token_secret: "{{ proxmox_token_secret }}"
    api_host: "{{ api_host }}"
    node: "{{ effective_target_node }}"
    vmid: "{{ vm_id }}"
    state: started
  when: not ludus_vm_start_hook_handled
  retries: "{{ ludus_vm_start_retries | default(3) }}"
  delay: 5
