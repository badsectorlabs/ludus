- name: Pre run checks
  hosts: localhost
  tags: [always]
  gather_facts: false
  tasks:
    - name: Require enterprise entitlement for certificate authentication
      ansible.builtin.assert:
        that:
          - ludus_entitlements is defined and 'ENTERPRISE_PLUGIN' in ludus_entitlements
        fail_msg: "Certificate-based authentication requires the ENTERPRISE_PLUGIN entitlement"
      when: defaults.use_cert_auth | default(false)

    - name: Keep Windows SSH provisioning separate from domain role credentials
      ansible.builtin.assert:
        that:
          - defaults.cert_auth_windows_user | default('localuser', true) | lower not in [defaults.ad_domain_admin | default('domainadmin') | lower, defaults.ad_domain_user | default('domainuser') | lower]
        fail_msg: "The Windows SSH provisioning account must differ from defaults.ad_domain_admin and defaults.ad_domain_user. Domain roles still need those accounts and their configured passwords."
      loop: "{{ ludus | default([]) }}"
      loop_control:
        label: "{{ item.vm_name }}"
      when:
        - defaults.use_cert_auth | default(false)
        - not item.unmanaged | default(false)
        - item.windows is defined
        - item.domain is defined

    - name: Check for Proxmox token
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].proxmox_full_token_id is defined
          - hostvars['localhost'].proxmox_token_secret is defined
        fail_msg: "Proxmox token is not defined"
        success_msg: "Proxmox token is defined"

    - name: Split the token id
      ansible.builtin.set_fact:
        proxmox_token_username: "{{ hostvars['localhost']['proxmox_full_token_id'] | split('!') | first }}"
        proxmox_token_id: "{{ hostvars['localhost']['proxmox_full_token_id'] | split('!') | last }}"

    - name: Check for valid token id
      ansible.builtin.assert:
        that:
          - proxmox_token_username == hostvars['localhost']['api_user']

    - name: Check for valid dynamic inventory
      ansible.builtin.assert:
        that:
          # If the user is an admin, and deploys an ADMIN VM (i.e. nexus cache) and then deletes their range, they will not have their range_id in groups.
          # https://gitlab.com/badsectorlabs/ludus/-/issues/107
          - range_id in groups or 'ADMIN' in groups
        fail_msg: "Dynamic inventory failed to load correctly. This may be an issue if the ludus-token was modified in Proxmox."
        success_msg: "Dynamic inventory loaded!"
